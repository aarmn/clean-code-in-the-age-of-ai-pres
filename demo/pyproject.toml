[project]
name = "clean-code-lab"
version = "1.0.0"
description = "Synthetic local examples for Clean Code in the AI Age"
requires-python = ">=3.12"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[tool.ruff]
target-version = "py312"
line-length = 94

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
