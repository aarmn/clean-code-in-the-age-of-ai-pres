[project]
name = "booking-workshop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34"]

[dependency-groups]
dev = [
    "httpx2>=2",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "ty",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
